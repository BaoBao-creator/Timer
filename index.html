<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101114">
  <meta name="description" content="Bộ bấm giờ đơn giản để luyện giải Rubik.">
  <title>Rubik Timer</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="timer-surface" id="timer-surface">
    <div class="timer" id="timer" role="timer" aria-live="off" aria-label="Thời gian: 0.00">0.00</div>
    <p class="hint" id="hint" role="status" aria-live="polite">Nhấn giữ màn hình hoặc phím cách</p>
    <p class="instructions">Giữ hơn 0,5 giây · Thả để bắt đầu · Chạm hoặc nhấn phím bất kỳ để dừng</p>
  </main>
</body>
</html>
